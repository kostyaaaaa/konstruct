<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The console mark: a hexagon with a check, matching the header.

    Colours are inlined as hex because a favicon renders outside the page's
    CSS and cannot read the oklch tokens. Keep them in step with the canvas
    and accent tokens in globals.css.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0b0e" />
  <g transform="translate(4 4)" fill="none" stroke="#b48df4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 21 7 21 17 12 22 3 17 3 7Z" />
    <path d="M8 11 11 14 16 8" />
  </g>
</svg>
